<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Rehearsal · Reachoreo</title>
<style>
  :root { --bg: #0d0c1c; --panel: #17152e; --line: #2f2a58; --text: #ede9ff; --dim: #a9a3cc; --ref: #f2b544; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; top: 49px; display: grid; grid-template-columns: 1fr; }
  body.compare .stage { grid-template-columns: 1fr 1fr; }
  #view, #flat { width: 100%; height: 100%; display: block; }
  #flat { display: none; } body.compare #flat { display: block; }
  #view canvas { width: 100% !important; height: 100% !important; display: block; }
  .hud { position: fixed; top: 64px; left: 18px; right: 18px; display: flex; justify-content: space-between; pointer-events: none; text-shadow: 0 2px 10px #000; }
  body.compare .hud { right: 50%; }
  .count { font: 800 72px/1 ui-monospace, Menlo, monospace; }
  .ph { text-align: right; } .ph b { font-size: 22px; display: block; } .ph span { color: var(--dim); }
  #lane { position: fixed; left: 0; right: 0; bottom: 58px; height: 128px; width: 100%; pointer-events: none; }
  body.compare #lane { right: 50%; width: 50%; }
  .goldmsg { position: fixed; left: 50%; top: 120px; transform: translateX(-50%); font: 800 26px sans-serif; color: #f2b544; text-shadow: 0 0 18px #f2b544aa; pointer-events: none; }
  .count.gold { color: #f2b544; }
  .rating { position: fixed; left: 50%; bottom: 210px; transform: translateX(-50%) scale(0.6); font: 900 54px/1 -apple-system, sans-serif; letter-spacing: .03em;
            opacity: 0; transition: transform .12s ease-out, opacity .2s; pointer-events: none; text-shadow: 0 0 24px currentColor, 0 3px 0 #0008; }
  .rating.pop { opacity: 1; transform: translateX(-50%) scale(1); }
  body.compare .rating { left: 25%; }
  .scorebox { position: fixed; right: 18px; top: 128px; text-align: right; pointer-events: none; text-shadow: 0 2px 10px #000; }
  .stars { position: relative; display: inline-block; font-size: 30px; letter-spacing: 2px; }
  .stars .bg { color: #ffffff33; } .stars .fill { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; color: #f2b544; width: 0; transition: width .3s; }
  .pts b { font: 800 34px ui-monospace, monospace; } .pts span { color: var(--dim); }
  .combo { font: 800 18px sans-serif; color: #7fe3ff; min-height: 1.3em; }
  .summary { position: fixed; left: 50%; top: 170px; transform: translateX(-50%); background: #17152ef0; border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; font-size: 16px; }
  #camera.on { background: #3ddc84; color: #06210f; border-color: #3ddc84; font-weight: 700; }
  dialog { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 16px; padding: 22px 28px; text-align: center; min-width: 320px; }
  dialog::backdrop { background: #000b; }
  .tapdot { width: 70px; height: 70px; border-radius: 50%; background: #2f2a58; margin: 14px auto; transition: background .05s; } .tapdot.hit { background: #f2b544; }
  label.tg { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--dim); cursor: pointer; }
  .cue { position: fixed; left: 18px; bottom: 196px; max-width: 60%; font-size: 17px; color: var(--ref); font-weight: 700; text-shadow: 0 2px 10px #000; pointer-events: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 16px; background: #0b0a18ee; border-top: 1px solid var(--line); }
  .bar button, .bar select { font: inherit; color: var(--text); background: #211e40; border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; cursor: pointer; }
  .bar button.go { background: #3ddc84; color: #06210f; border-color: #3ddc84; font-weight: 700; }
  .bar .dim { color: var(--dim); font-size: 12px; } .bar .sp { flex: 1; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--dim); z-index: 10; }
</style>
</head>
<body>
<div class="stage"><div id="view"></div><canvas id="flat"></canvas></div>
<div class="hud"><div class="count" id="count"></div><div class="ph"><b id="pname">Ready</b><span id="act"></span></div></div>
<div class="cue" id="cue"></div>
<div class="goldmsg" id="gold"></div>
<canvas id="lane" aria-label="Upcoming moves"></canvas>
<div class="rating" id="rating"></div>
<div class="scorebox" id="scorebox" hidden>
  <div class="stars"><span class="bg">★★★★★</span><span class="fill" id="starfill">★★★★★</span></div>
  <div class="pts"><b id="points">0</b> <span id="starcount"></span></div><div class="combo" id="combo"></div>
</div>
<div class="summary" id="summary" hidden></div>
<dialog id="tapdlg"><h3>Tap to the beat</h3><p id="tapmsg"></p><div class="tapdot" id="tapdot"></div><p id="tapn" class="dim"></p>
  <button id="tapclose">Done</button></dialog>
<div class="bar">
  <button class="go" id="play">▶ Play</button><button id="restart" title="Count in again and start the range">↺ Again</button>
  <span class="dim">practice</span><select id="from" aria-label="From phrase"></select><span class="dim">to</span><select id="to" aria-label="To phrase"></select>
  <label class="tg"><input type="checkbox" id="loop">loop</label>
  <select id="speed" aria-label="Speed" title="Slower practice keeps the music's pitch"><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option></select>
  <label class="tg" title="The coach moves like your reflection (raises its left arm when you raise your right)"><input type="checkbox" id="mirror" checked>mirror</label>
  <label class="tg"><input type="checkbox" id="lanebox" checked>moves lane</label>
  <button id="camera" title="Your webcam: scores every move and shows your ghost">📷 Camera: off</button>
  <button id="calibrate" title="Stand where you'll dance, arms relaxed">Calibrate</button>
  <label class="tg" title="Your tracked body, see-through over the coach"><input type="checkbox" id="ghostbox" checked>ghost</label>
  <button id="taptest" title="Tap along to the beat: lines the page up with what you hear">⏱ <span id="avoff">0 ms</span></button>
  <button id="enterar" class="go" hidden title="Passthrough: the coach and robots in your real kitchen. The safe default.">AR</button>
  <button id="entervr" hidden title="The whole virtual kitchen. Only in a cleared space with your Guardian boundary set.">VR</button>
  <button id="reset" title="Back to the audience's view">Reset view</button>
  <span class="dim" id="time"></span><span class="sp"></span><span class="dim" id="perf"></span>
</div>
<div id="loading">Loading the kitchen and both Reachys…</div>
<script type="module">
  // the site's top bar (Home, Make a dance, Rehearse, …) comes from the dashboard
  import("/static/nav.mjs").then(m => m.mountNav("rehearse3d")).catch(() => {});
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
